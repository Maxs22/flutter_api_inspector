name: flutter_api_inspector
description: >-
  Debug-first in-app HTTP inspector for Flutter mobile/desktop. Live
  timeline, route grouping, details, and QA force-enable support without
  proxy setup.
version: 0.4.0
repository: https://github.com/Maxs22/flutter_api_inspector

# Color.withValues and the ColorScheme surfaceContainer* roles the
# overlay theme uses require Flutter 3.27 / Dart 3.6.
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

# Web is intentionally unsupported: the browser's own DevTools
# Network tab already covers web; this package exists for mobile /
# desktop, where there is no console. pub.dev reads this key and
# shows the platform badges accordingly.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  flutter:
    sdk: flutter
  # Required by lib/interceptor/dio_interceptor.dart (TracedDioInterceptor).
  # Users who don't use Dio can avoid this dependency by importing
  # package:flutter_api_inspector/interceptor/http_overrides.dart
  # directly instead of the main barrel.
  dio: ^5.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: InspectorIcons
      fonts:
        - asset: assets/fonts/inspector-icons.ttf
    - family: InspectorSans
      fonts:
        - asset: assets/fonts/inspector-sans-400.ttf
          weight: 400
        - asset: assets/fonts/inspector-sans-500.ttf
          weight: 500
        - asset: assets/fonts/inspector-sans-600.ttf
          weight: 600
        - asset: assets/fonts/inspector-sans-700.ttf
          weight: 700
    - family: InspectorMono
      fonts:
        - asset: assets/fonts/inspector-mono-400.ttf
          weight: 400
        - asset: assets/fonts/inspector-mono-700.ttf
          weight: 700
